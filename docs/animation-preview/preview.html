<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated drawings preview</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .bg { padding: 32px 20px; }
  .day { background: #F6EEE3; color: #34402A; }
  .night { background: #1F2619; color: #F6EEE3; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1120px; margin: 0 auto; }
  figure { margin: 0; width: 320px; }
  .card { background: #FBF6EE; border-radius: 22px; padding: 12px; box-sizing: border-box; height: 320px; display: flex; align-items: center; justify-content: center; }
  .card img { max-width: 100%; max-height: 100%; }
  figcaption { font-size: 14px; margin-top: 8px; }
  .reload { display: block; margin: 0 auto 20px; max-width: 1120px; font-size: 14px; }
</style>
</head>
<body>
<section class="bg day"><div class="row" style="flex-direction:column;gap:0"><h1>Day</h1></div>
<div class="row" id="day"></div></section>
<section class="bg night"><div class="row" style="flex-direction:column;gap:0"><h1>Night (drawings stay on light cards)</h1></div>
<div class="row" id="night"></div></section>
<script>
  const files = ['illo-her-half-hour','illo-tea-warm','illo-tea-cold','illo-the-chair','illo-baby-up','rfm-mark'];
  for (const id of ['day','night']) {
    document.getElementById(id).innerHTML = files.map(f =>
      `<figure><div class="card"><img src="../../public/brand/animated/${f}.svg" alt="${f}"></div><figcaption>${f}</figcaption></figure>`).join('');
  }
</script>
</body>
</html>
